<html>
        <head>
                <script src="script.js"></script>
<style>
table {table-layout: fixed; width: 100%;}
td {text-align: center; color: white;}
dialog {text-align: center;}
.unknown  {background-color: darkgrey;}
.criminal {background-color: darkred;}
.innocent {background-color: darkgreen;}
td.unknown div.clue {visibility: hidden;}
</style>
        </head>
        <body>
                <table id="suspects">
                </table>
                <dialog id='jaccuse'>
                        <div id='emoji'></div>
                        <div id='name'></div>
                        <div id='job'></div>
                        <button id='criminal'>Criminal</button>
                        <button id='innocent'>Innocent</button>
                        <button id='cancel'>Cancel</button>
                </dialog>
                <dialog id='disallowed'>
                        <div>You can't prove that!</div>
                        <button id='closeDisallowed'>Continue</button>
                </dialog>
                <dialog id='success'>
                        <div>You have solved the mystery!</div>
                        <div id="score"></div>
                        <button commandfor="success" command="close">Hell yes I am the greatest detective in HISTORY</button>
                </dialog>
        </body>
</html>
